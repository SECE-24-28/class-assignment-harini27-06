<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 10;
            color: brown;
        }
        p{
            color:blue;
            font-family: Arial, Helvetica, sans-serif;
        }
        h2{
            font-family:Georgia, 'Times New Roman', Times, serif;
            font-size: 10;
            color:brown;

        }
        div{
            width: 600px;
            height:600px;
            border:5px solid red;
            border-radius: 1rem;
            display:inline;
            padding: 1rem 2rem 1rem 2rem;
            margin-top: 3rem;

        }
        span{
            width:10px;
            height:10px;
            border:5px solid rgb(155, 29, 155);
            border-radius: 2rem;
            display:block;
            padding: 1rem 2rem 1rem 2rem;
            margin-top: 3rem;

        }
    </style>
</head>
<body>
    <h1>welcome to the blog!</h1>
    <p>this blog is an example of css</p>
    <h2>example for border padding margin</h2>
    <div>vakkkk</div>
    <div>tatoww</div>
    <div>bye</div>
    <div>tata</div>
    <p>this is example for block display</p>
    <span>hahha</span>
    <span>hehhe</span>
    <span>hehaheha</span>
    <span>hahehahe</span>

</body>
</html>
